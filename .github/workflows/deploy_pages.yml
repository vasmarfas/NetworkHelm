name: Deploy Pages
run-name: Deploy Pages ${{ inputs.version_name }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version (e.g. 1.1.0, 1.2.0-rc1)'
        required: true
      publish:
        description: 'Publish the page on GitHub Pages'
        type: boolean
        default: true
  workflow_call:
    inputs:
      version_name:
        type: string
        required: false
        default: ''
      publish:
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  page:
    name: Page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) echo "::error::the version is not given"; exit 1 ;;
            esac
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # the page that says it has no gateway behind it, with the demo routers and a manifest to install it
      - name: Build the page
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew :app:webApp:pagesBundle

      # the same files as an archive, for a web server of one's own
      - name: Pack the page
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          mkdir -p out
          (cd app/webApp/build/pages && zip -qr "$GITHUB_WORKSPACE/out/NetworkHelm-web-$VERSION.zip" .)

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: out/*
          if-no-files-found: error

      # artifacts outlive a re-run, and deploy-pages refuses to choose between two with the same name
      - name: Upload the page
        if: ${{ inputs.publish }}
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: app/webApp/build/pages
          include-hidden-files: true

  deploy:
    name: GitHub Pages
    needs: page
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
