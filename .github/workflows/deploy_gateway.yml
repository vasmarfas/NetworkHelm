name: Deploy Gateway
run-name: Deploy Gateway ${{ inputs.version_name }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version (e.g. 1.0.0)'
        required: true
      push_image:
        description: 'Push the Docker image to ghcr.io'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version_name:
        type: string
        required: false
        default: ''
      push_image:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the web app is the same on every system, so it is built once, on Linux: Windows on ARM has no Binaryen to optimize it with, and
  # webpack ran out of memory on the macOS ARM runner
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) echo "::error::the version is not given"; exit 1 ;;
            esac
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the web bundle
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew :app:webApp:webAppBundle

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle-gateway
          path: app/webApp/build/bundle
          retention-days: 1
          if-no-files-found: error

  gateway:
    name: Gateway ${{ matrix.system }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            os: ubuntu-latest
          - system: windows
            os: windows-latest
          # the ARM runners are new to this pipeline: a failure there leaves the x64 archives alone and does not stop the release
          - system: linux-arm64
            os: ubuntu-24.04-arm
            experimental: true
          - system: windows-arm64
            os: windows-11-arm
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Download the web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle-gateway
          path: app/webApp/build/bundle

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) echo "::error::the version is not given"; exit 1 ;;
            esac
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # the archive carries the jar, which carries the web app, and a Java runtime of this system: jlink writes the
      # runtime of the JDK that runs it, so each system builds its own archive
      - name: Build the archive
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew -x :app:webApp:webAppBundle :server:gatewayArchive

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
          SYSTEM: ${{ matrix.system }}
        run: |
          set -eu
          mkdir -p out
          cp server/build/gateway/NetworkHelm-gateway-"$VERSION"-* out/
          # the jar is the same on every system, so one of them hands it over
          if [ "$SYSTEM" = linux ]; then
            cp server/build/libs/networkhelm-gateway.jar "out/NetworkHelm-gateway-$VERSION.jar"
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-gateway-${{ matrix.system }}
          path: out/*
          if-no-files-found: error

      # arm64 as well, for the container of a router
      - name: Set up QEMU
        if: ${{ matrix.system == 'linux' && inputs.push_image }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: ${{ matrix.system == 'linux' && inputs.push_image }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: ${{ matrix.system == 'linux' && inputs.push_image }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the context is server/; a prerelease does not move latest
      - name: Build and push the image
        if: ${{ matrix.system == 'linux' && inputs.push_image }}
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/networkhelm-gateway"
          tags="-t $image:$VERSION"
          case "$VERSION" in
            *-*) ;;
            *) tags="$tags -t $image:latest" ;;
          esac
          docker buildx build --platform linux/amd64,linux/arm64 $tags --push server
