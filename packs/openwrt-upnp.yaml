# yaml-language-server: $schema=./pack.schema.json
platform: openwrt
menu: [IP, UPnP]
window:
  title: UPnP
  tabs:
    - { title: Port Maps, path: status/upnp }
    - { title: Settings, path: upnpd/upnpd }
