  mac-address-mask: MAC Mask
  ht-basic-mcs: HT Basic MCS
  ht-supported-mcs: HT Supported MCS
  vht-basic-mcs: VHT Basic MCS
  vht-supported-mcs: VHT Supported MCS
  basic: Basic Rates
  supported: Supported Rates
  packets: Tx/Rx Packets
  bytes: Tx/Rx Bytes
  tx-bits-per-second: Tx
  rx-bits-per-second: Rx
  tx-packets-per-second: Tx Packet (p/s)
  rx-packets-per-second: Rx Packet (p/s)
  hw-retries: Hw. Retries
  hw-protection-mode: Hw. Protection Mode
  hw-supported-modes: Hw. Supported Modes
  max-sta-count: Max Station Count
  tx-chains: HT Tx Chains
  rx-chains: HT Rx Chains
  guard-interval: HT Guard Interval
  channel.control-channel-width: Control Channel Width
  channel.extension-channel: Extension Channel
  channel.tx-power: Tx Power
  channel.save-selected: Save Selected
  channel.reselect-interval: Reselect Interval
  channel.skip-dfs-channels: Skip DFS Channels
  rates.basic: Basic Rates
  rates.supported: Supported Rates
  rates.ht-basic-mcs: HT Basic MCS
  rates.ht-supported-mcs: HT Supported MCS
  rates.vht-basic-mcs: VHT Basic MCS
  rates.vht-supported-mcs: VHT Supported MCS
  datapath.mtu: MTU
  datapath.l2mtu: L2 MTU
  datapath.arp: ARP
  datapath.bridge-cost: Bridge Cost
  datapath.bridge-horizon: Bridge Horizon
  datapath.local-forwarding: Local Forwarding
  datapath.client-to-client-forwarding: Client To Client Forwarding
  datapath.interface-list: Interface List
  security.authentication-types: Authentication Type
  security.encryption: Encryption
  security.group-encryption: Group Encryption
  security.group-key-update: Group Key Update
  security.passphrase: Passphrase
  security.disable-pmkid: Disable PMKID
  security.eap-methods: EAP Methods
