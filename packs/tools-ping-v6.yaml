# yaml-language-server: $schema=./pack.schema.json
menu: [Tools, Ping]
until: 7.0
window:
  title: Ping
  tabs:
    - { title: Ping, path: ping }
paths:
  ping:
    form: ping
    columns: [seq, host, time, size, ttl, status]
    readonly: [seq, host, time, status, sent, received, packet-loss, min-rtt, avg-rtt, max-rtt]
    summary: [sent, received, packet-loss, min-rtt, avg-rtt, max-rtt]
    types:
      arp-ping: { type: yes-no }
      count: { type: integer, scaled: true }
      interval: { type: time }
      size: { type: integer, scaled: true }
      ttl: { type: integer, scaled: true }
      dscp: { type: integer, scaled: true }
      do-not-fragment: { type: switch }
forms:
  ping:
    tabs:
      - title: General
        fields: [address, interface, arp-ping, count, interval]
      - title: Advanced
        fields: [src-address, size, ttl, dscp, routing-table, do-not-fragment]
labels:
  address: Ping To
  seq: "Seq #"
