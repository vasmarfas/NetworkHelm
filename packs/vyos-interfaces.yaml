# yaml-language-server: $schema=./pack.schema.json
platform: vyos
menu: [Interfaces]
window:
  title: Interfaces
  tabs:
    - { title: Ethernet, path: interfaces/ethernet }
    - { title: Bridge, path: interfaces/bridge }
    - { title: Bonding, path: interfaces/bonding }
    - { title: WireGuard, path: interfaces/wireguard }
    - { title: PPPoE, path: interfaces/pppoe }
    - { title: Dummy, path: interfaces/dummy }
    - { title: Loopback, path: interfaces/loopback }
    - { title: Status, path: status/interfaces }
paths:
